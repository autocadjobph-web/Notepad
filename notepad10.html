#backToTopBtn {
    position: fixed;
    right: 1.25rem;
    bottom: 1.25rem;
    z-index: 40;
    width: 3rem;
    height: 3rem;
    border-radius: 9999px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 45%, #8b5cf6 100%);
    color: #ffffff;
    border: none;
    box-shadow: 0 8px 20px -4px rgba(59,130,246,0.5), 0 4px 10px -2px rgba(139,92,246,0.35);
    opacity: 0;
    transform: translateY(10px) scale(0.85);
    pointer-events: none;
    transition: opacity 250ms ease, transform 250ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 200ms ease;
    cursor: pointer;
}
#backToTopBtn::before {
    content: "";
    position: absolute;
    inset: -5px;
    border-radius: 9999px;
    background: linear-gradient(135deg, #60a5fa, #8b5cf6);
    opacity: 0.35;
    filter: blur(7px);
    z-index: -1;
    transition: opacity 200ms ease;
}
#backToTopBtn.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
}
#backToTopBtn:hover {
    transform: translateY(-3px) scale(1.08);
    box-shadow: 0 14px 28px -6px rgba(59,130,246,0.55), 0 8px 14px -4px rgba(139,92,246,0.45);
}
#backToTopBtn:hover::before {
    opacity: 0.6;
}
#backToTopBtn:active {
    transform: translateY(-1px) scale(0.95);
}
#backToTopBtn i {
    font-size: 1.15rem;
    animation: backToTopBounce 2.2s ease-in-out infinite;
}
@keyframes backToTopBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
}
.dark #backToTopBtn {
    box-shadow: 0 8px 20px -4px rgba(139,92,246,0.45), 0 4px 10px -2px rgba(59,130,246,0.35);
}
.dark #backToTopBtn:hover {
    box-shadow: 0 14px 28px -6px rgba(139,92,246,0.55), 0 8px 14px -4px rgba(59,130,246,0.45);
}

<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 flex flex-col overflow-hidden transition-colors duration-200">

    <!-- HEADER -->
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-4 py-3 flex items-center justify-between shrink-0 shadow-sm z-10">
        <div class="flex items-center space-x-3">
            <button id="sidebarToggle" class="p-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition active:scale-95" aria-label="Toggle Files">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>

            <div class="flex flex-col">
                <div class="flex items-center space-x-2">
                    <span id="fileNameDisplay" class="font-semibold text-sm sm:text-base tracking-tight truncate max-w-[160px] sm:max-w-xs cursor-pointer hover:text-primary transition" title="Click to rename">
                        index.html <i class="fa-solid fa-pen text-[10px] opacity-60"></i>
                    </span>
                    <span id="unsavedIndicator" class="hidden w-2 h-2 rounded-full bg-amber-500 animate-pulse" title="Unsaved changes"></span>
                </div>

                <span id="fileHandleStatus" class="text-[10px] text-slate-400 dark:text-slate-500 truncate max-w-[180px]">
                    New Local File
                </span>
            </div>
        </div>

        <div class="flex items-center space-x-1 sm:space-x-2">
            <button id="previewBtn" title="Live Preview HTML" class="flex items-center space-x-1 px-3 py-2 rounded-xl bg-purple-50 dark:bg-purple-900/40 text-purple-600 dark:text-purple-400 hover:bg-purple-100 dark:hover:bg-purple-900/60 transition active:scale-95 font-medium text-xs">
                <i class="fa-solid fa-eye text-sm"></i>
                <span class="hidden sm:inline">Preview</span>
            </button>

            <button id="newBtn" title="New Note" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 transition active:scale-95 flex items-center justify-center">
                <i class="fa-solid fa-file-circle-plus text-sm"></i>
            </button>

            <button id="saveAsBtn" title="Save File to Device..." class="p-2.5 rounded-xl bg-blue-50 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 hover:bg-blue-100 dark:hover:bg-blue-900/60 transition active:scale-95 flex items-center justify-center font-medium text-xs space-x-1 px-3">
                <i class="fa-solid fa-floppy-disk text-sm"></i>
                <span class="hidden sm:inline">Save</span>
            </button>
        </div>
    </header>

    <div class="flex-1 flex relative overflow-hidden">

        <!-- SIDEBAR -->
        <aside id="sidebar" class="absolute inset-y-0 left-0 z-20 w-72 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col shadow-2xl md:relative md:translate-x-0">

            <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
                <h2 class="font-bold text-sm tracking-wide uppercase text-slate-500 dark:text-slate-400 flex items-center gap-2">
                    <i class="fa-solid fa-notebook"></i> Saved Notes
                </h2>

                <button id="closeSidebar" class="md:hidden p-1.5 rounded-lg text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="p-3 border-b border-slate-200 dark:border-slate-700">
                <button id="openFolderBtn" class="w-full flex items-center justify-center gap-2 text-xs font-medium py-2 px-3 rounded-lg bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-100 dark:hover:bg-emerald-900/50 transition active:scale-95">
                    <i class="fa-solid fa-folder-open"></i> Open Folder
                </button>
                <input type="file" id="folderInputFallback" webkitdirectory directory multiple class="hidden">
            </div>

            <div id="folderSection" class="hidden border-b border-slate-200 dark:border-slate-700">
                <div class="px-3 pt-3 pb-1 flex items-center justify-between">
                    <h3 class="text-xs font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400 truncate flex items-center gap-1.5 min-w-0">
                        <i class="fa-solid fa-folder text-amber-500 shrink-0"></i>
                        <span id="folderNameText" class="truncate">Folder</span>
                    </h3>

                    <button id="closeFolderBtn" title="Close folder" class="text-slate-400 hover:text-red-500 p-1 rounded shrink-0">
                        <i class="fa-solid fa-xmark text-xs"></i>
                    </button>
                </div>

                <div id="folderFilesList" class="max-h-56 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-700/50 pb-2"></div>
            </div>

            <div id="notesList" class="flex-1 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-700/50"></div>

            <div class="p-3 border-t border-slate-200 dark:border-slate-700 flex flex-col gap-3 bg-slate-50 dark:bg-slate-800/80">
                <div class="flex items-center justify-between">
                    <span class="text-xs text-slate-500 dark:text-slate-400">Dark Appearance</span>

                    <button id="themeToggle" class="w-10 h-6 flex items-center bg-slate-300 dark:bg-primary rounded-full p-1 transition-colors cursor-pointer" aria-label="Toggle theme">
                        <div id="themeToggleDot" class="bg-white w-4 h-4 rounded-full shadow-md transform dark:translate-x-4 transition-transform"></div>
                    </button>
                </div>

                <button id="hardRefreshBtn" class="w-full py-2 px-3 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 rounded-xl text-xs font-medium text-slate-700 dark:text-slate-200 flex items-center justify-center gap-2 transition active:scale-95">
                    <i class="fa-solid fa-rotate text-primary"></i> Hard Refresh App
                </button>
            </div>
        </aside>

        function applyIconTo(el) {
            if (!el.classList || (el.dataset && el.dataset.iconApplied)) {
                return;
            }

            let iconName = null;

            el.classList.forEach(cls => {
                if (iconName) return;
                const match = cls.match(/^fa-([a-z0-9-]+)$/);
                if (match && match[1] !== "solid" && ICONS[match[1]]) {
                    iconName = match[1];
                }
            });

            if (!iconName) {
                return;
            }

            el.innerHTML = ICONS[iconName];
            el.dataset.iconApplied = "1";
        }

        function processIconsIn(node) {
            if (!node || node.nodeType !== 1) {
                return;
            }

            applyIconTo(node);

            if (node.querySelectorAll) {
                node.querySelectorAll('[class*="fa-"]').forEach(applyIconTo);
            }
        }

        processIconsIn(document.body);

        const iconObserver = new MutationObserver(mutations => {
            mutations.forEach(mutation => {
                mutation.addedNodes.forEach(processIconsIn);

        /* =========================================================
           PREVIEW
        ========================================================= */

        function isExternalRef(ref) {
            return !ref
                || /^[a-z][a-z0-9+.-]*:/i.test(ref)   // any scheme (http:, https:, data:, blob:, mailto:, etc.)
                || ref.startsWith("//");               // protocol-relative
        }

        function normalizeRelativePath(basePath, ref) {
            // A single leading "/" is commonly used to mean "relative to the
            // project root" (not an actual absolute filesystem/URL path) —
            // resolve it against the open folder's root rather than treating
            // it as external.
            const effectiveBase = ref.startsWith("/") ? "" : basePath;
            const cleanRef = ref.startsWith("/") ? ref.slice(1) : ref;

            const combined = (effectiveBase ? effectiveBase + "/" : "") + cleanRef;
            const parts = combined.split("/");
            const stack = [];

            for (const part of parts) {
                if (part === "" || part === ".") {
                    continue;
                }
                if (part === "..") {
                    stack.pop();
                    continue;
                }
                stack.push(part);
            }

            return stack.join("/");
        }

        async function readFolderEntryAsText(entry) {
            const file = entry.kind === "directoryAPI"
                ? await entry.handle.getFile()
                : entry.file;

            return file.text();
        }

        // Finds a sibling file in the currently open folder matching a relative
        // href/src, reads it, and returns a blob URL for it (or null if there's
        // no open folder, the reference is external, or no match is found).
        async function resolveFolderRef(ref, basePath) {
            if (isExternalRef(ref) || openFolderEntries.length === 0) {
                return { url: null, skipped: true };
            }

            const normalizedPath = normalizeRelativePath(basePath, ref);

            let match = openFolderEntries.find(entry => entry.path === normalizedPath);

            if (!match) {
                // Fallback: match by filename alone, for flat folders or cases
                // where the folder structure doesn't line up exactly.
                const refName = ref.split("/").pop();
                match = openFolderEntries.find(entry => entry.name === refName);
            }

            if (!match) {
                return { url: null, skipped: false };
            }

            try {
                const text = await readFolderEntryAsText(match);
                const blob = new Blob([text], { type: getMimeType(match.name) });
                const url = URL.createObjectURL(blob);
                previewObjectUrls.push(url);
                return { url, skipped: false };
            } catch (error) {
                console.warn("Preview: could not load referenced file", ref, error);
                return { url: null, skipped: false };
            }
        }

        // Finds a sibling file in the open folder matching a relative ref and
        // returns its contents as a plain text string (or null if there's no
        // open folder, the ref is external, or no matching file is found).
        // Used to physically inline CSS/JS text into the preview HTML.
        async function readMatchingFolderText(ref, basePath) {
            if (isExternalRef(ref) || openFolderEntries.length === 0) {
                return null;
            }

            const normalizedPath = normalizeRelativePath(basePath, ref);

            let match = openFolderEntries.find(entry => entry.path === normalizedPath);

            if (!match) {
                const refName = ref.split("/").pop();
                match = openFolderEntries.find(entry => entry.name === refName);
            }

            if (!match) {
                return null;
            }

            try {
                return await readFolderEntryAsText(match);
            } catch (error) {
                console.warn("Preview: could not load referenced file", ref, error);
                return null;
            }
        }

        // Combines a multi-file setup (index.html + style.css + main.js, etc.)
        // into a single self-contained HTML string by reading each locally
        // referenced stylesheet/script as text and inlining it directly in
        // place of the <link>/<script src> tag. This is what lets the sandboxed
        // <iframe> render the whole "project" via srcdoc without needing
        // separate network requests for each file.
        async function inlineLocalAssets(htmlText, basePath) {
            if (openFolderEntries.length === 0) {
                return { html: htmlText, unresolved: [] };
            }

            let result = htmlText;
            const unresolved = [];

            // --- Inline stylesheets: <link rel="stylesheet" href="..."> -> <style>
            {
                const linkPattern = /<link\b[^>]*>/gi;
                const matches = [...result.matchAll(linkPattern)];

                for (let i = matches.length - 1; i >= 0; i--) {
                    const tag = matches[i][0];

                    if (!/\brel\s*=\s*["']?stylesheet["']?/i.test(tag)) {
                        continue;
                    }

                    const hrefMatch = tag.match(/\bhref\s*=\s*(["'])(.*?)\1/i);
                    if (!hrefMatch) {
                        continue;
                    }

                    const ref = hrefMatch[2];
                    if (isExternalRef(ref)) {
                        continue;
                    }

                    const text = await readMatchingFolderText(ref, basePath);

                    if (text !== null) {
                        const replacement = `<style data-inlined-from="${escapeHtml(ref)}">\n${text}\n</style>`;
                        result = result.slice(0, matches[i].index)
                            + replacement
                            + result.slice(matches[i].index + tag.length);
                    } else {
                        unresolved.push(ref);
                    }
                }
            }

            // --- Inline scripts: <script src="..."> tags -> plain inline <script> tags
            {
                const scriptPattern = /<script\b[^>]*\bsrc\s*=\s*(["'])(.*?)\1[^>]*>\s*<\/script>/gi;
                const matches = [...result.matchAll(scriptPattern)];

                for (let i = matches.length - 1; i >= 0; i--) {
                    const full = matches[i][0];
                    const ref = matches[i][2];

                    if (isExternalRef(ref)) {
                        continue;
                    }

                    const text = await readMatchingFolderText(ref, basePath);

                    if (text !== null) {
                        const replacement = `<script data-inlined-from="${escapeHtml(ref)}">\n${text}\n<\/script>`;
                        result = result.slice(0, matches[i].index)
                            + replacement
                            + result.slice(matches[i].index + full.length);
                    } else {
                        unresolved.push(ref);
                    }
                }
            }

            return { html: result, unresolved };
        }

        // Rewrites relative href="" / src="" in <link> and <script> tags to
        // point at blob URLs built from the matching files in the open folder,
        // so previewing an .html file also pulls in its sibling .css/.js.
        // Returns both the rewritten HTML and a list of references that looked
        // local but had no matching file, so that can be surfaced to the user.
        // (Used as a fallback for anything inlineLocalAssets doesn't handle,
        // e.g. non-stylesheet <link> tags or other binary assets.)
        async function resolvePreviewHtml(htmlText) {
            if (openFolderEntries.length === 0) {
                return { html: htmlText, unresolved: [] };
            }

            const basePath = activeFolderEntry
                ? activeFolderEntry.path.split("/").slice(0, -1).join("/")
                : "";

            const refPattern = /(<(?:link|script)\b[^>]*?\b(?:href|src)\s*=\s*)(["'])(.*?)\2/gi;
            const matches = [];
            let match;

            while ((match = refPattern.exec(htmlText)) !== null) {
                matches.push(match);
            }

            let result = htmlText;
            const unresolved = [];

            // Walk backwards so earlier replacements don't shift later indices.
            for (let i = matches.length - 1; i >= 0; i--) {
                const [full, prefix, quote, ref] = matches[i];
                const { url, skipped } = await resolveFolderRef(ref, basePath);

                if (url) {
                    const replacement = `${prefix}${quote}${url}${quote}`;
                    result = result.slice(0, matches[i].index)
                        + replacement
                        + result.slice(matches[i].index + full.length);
                } else if (!skipped) {
                    unresolved.unshift(ref);
                }
            }

            return { html: result, unresolved };
        }

        function injectUnresolvedBanner(htmlText, unresolved) {
            if (unresolved.length === 0) {
                return htmlText;
            }

            const items = unresolved
                .map(ref => `<code style="background:rgba(0,0,0,0.15);padding:1px 5px;border-radius:4px;">${escapeHtml(ref)}</code>`)
                .join(", ");

            const banner = `
                <div style="position:fixed;top:0;left:0;right:0;z-index:2147483647;
                    background:#f59e0b;color:#111;font:12px/1.5 -apple-system,system-ui,sans-serif;
                    padding:8px 12px;">
                    <b>Preview:</b> could not find a matching file in the open folder for: ${items}
                    — check the filename/path matches exactly.
                </div>
            `;

            return /<body[^>]*>/i.test(htmlText)
                ? htmlText.replace(/<body[^>]*>/i, match => `${match}${banner}`)
                : banner + htmlText;
        }

        async function togglePreview(show) {
            if (show) {
                previewObjectUrls.forEach(url => URL.revokeObjectURL(url));
                previewObjectUrls = [];

                const basePath = activeFolderEntry
                    ? activeFolderEntry.path.split("/").slice(0, -1).join("/")
                    : "";

                // Step 1: read sibling CSS/JS files as text and inline them
                // directly into the HTML string (multi-file -> single string).
                const { html: inlinedHtml, unresolved: inlineUnresolved } =
                    await inlineLocalAssets(editor.value, basePath);

                // Step 2: anything left over (images, fonts, non-stylesheet
                // links, etc.) still gets rewritten to blob URLs so the
                // preview can load it.
                const { html, unresolved: blobUnresolved } =
                    await resolvePreviewHtml(inlinedHtml);

                const finalHtml = injectUnresolvedBanner(
                    html,
                    [...inlineUnresolved, ...blobUnresolved]
                );

                // Inject the combined HTML straight into the iframe via
                // srcdoc rather than a blob URL for the document itself.
                previewFrame.removeAttribute("src");
                previewFrame.srcdoc = finalHtml;
                previewContainer.classList.remove("hidden");
                updateBackToTopVisibility();
            } else {
                previewContainer.classList.add("hidden");
                previewFrame.removeAttribute("srcdoc");
                previewFrame.src = "about:blank";

                previewObjectUrls.forEach(url => URL.revokeObjectURL(url));
                previewObjectUrls = [];
                updateBackToTopVisibility();
            }
        }

        previewBtn.addEventListener("click", () => togglePreview(true));
        closePreviewBtn.addEventListener("click", () => togglePreview(false));

        /* =========================================================
           BACK TO TOP
        ========================================================= */

        function updateBackToTopVisibility() {
            const previewOpen = !previewContainer.classList.contains("hidden");
            const scrolledDown = editor.scrollTop > 150;

            backToTopBtn.classList.toggle("visible", !previewOpen && scrolledDown);
        }

        editor.addEventListener("scroll", updateBackToTopVisibility);

        backToTopBtn.addEventListener("click", () => {
            editor.scrollTo({ top: 0, behavior: "smooth" });
        });

        /* =========================================================
           FILE NAME HELPERS
        ========================================================= */

        function sanitizeFileName(name) {
            let cleanName = String(name || "").trim();

            // Remove characters that are invalid or problematic in filenames.
            cleanName = cleanName.replace(/[<>:"/\\|?*\x00-\x1F]/g, "");

            // Prevent empty filenames.
            if (!cleanName) {
                cleanName = "index.html";
            }

            // Limit filename length.
            if (cleanName.length > 150) {
                cleanName = cleanName.substring(0, 150);
            }

            return cleanName;
        }

        function updateFileNameDisplay() {
            fileNameDisplay.textContent = currentFileName;

            const icon = document.createElement("i");
            icon.className = "fa-solid fa-pen text-[10px] opacity-60";
            fileNameDisplay.appendChild(document.createTextNode(" "));
            fileNameDisplay.appendChild(icon);
        }

        /* =========================================================
           STORAGE
        ========================================================= */

        function getSavedNotes() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);

                if (!raw) {
                    return [];
                }

                const parsed = JSON.parse(raw);

                if (!Array.isArray(parsed)) {
                    return [];
                }

                let migrated = false;

                const notes = parsed
                    .filter(note => note && typeof note === "object")
                    .map(note => {
                        let name = note.name || "index.html";

                        if (
                            name === "document.html" ||
                            name === "document.txt" ||
                            name === ""
                        ) {
                            name = "index.html";
                            migrated = true;
                        }

                        return {
                            id: String(note.id || ("note_" + Date.now() + Math.random())),
                            name: sanitizeFileName(name),
                            content: typeof note.content === "string" ? note.content : "",
                            updatedAt: Number(note.updatedAt) || Date.now()
                        };
                    });

                if (migrated) {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
                }

                return notes;
            } catch (error) {
                console.error("Could not read saved notes:", error);
                return [];
            }
        }

        function writeNotes(notes) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
                return true;
            } catch (error) {
                console.error("Could not save notes:", error);

                showModal({
                    title: "Storage Error",
                    subtitle: "Unable to save locally",
                    content: "Your browser's local storage may be full or unavailable. Try deleting some saved notes or exporting your work to your device.",
                    confirmText: "Understood",
                    showCancel: false,
                    iconClass: "fa-solid fa-triangle-exclamation text-red-500",
                    confirmBtnClass: "bg-red-600 hover:bg-red-700 text-white"
                });

                return false;
            }
        }

        /* =========================================================
           NOTES LIST
        ========================================================= */

        function getFileIcon(fileName) {
            const name = fileName.toLowerCase();

            if (name.endsWith(".html") || name.endsWith(".htm")) {
                return "fa-file-code text-orange-500";
            }

            if (name.endsWith(".js")) {
                return "fa-file-code text-yellow-500";
            }

            if (name.endsWith(".css")) {
                return "fa-file-code text-blue-500";
            }

            if (name.endsWith(".json")) {
                return "fa-file-code text-green-500";
            }

            if (name.endsWith(".md")) {
                return "fa-file-lines text-purple-500";
            }

            return "fa-file-lines text-slate-400";
        }

        function renderNotesList() {
            const notes = getSavedNotes();
            notesList.innerHTML = "";

            if (notes.length === 0) {
                notesList.innerHTML = `
                    <div class="p-6 text-center text-slate-400 text-xs">
                        <i class="fa-solid fa-folder-open text-2xl mb-2 block opacity-40"></i>
                        No saved notes yet. Create or save a file to see it here!
                    </div>
                `;
                return;
            }

            notes.forEach(note => {
                const item = document.createElement("div");

                item.className = `p-3 hover:bg-slate-100 dark:hover:bg-slate-700/50 cursor-pointer flex items-center justify-between transition group ${
                    currentNoteId === note.id
                        ? "bg-blue-50/80 dark:bg-blue-900/20 border-l-4 border-primary"
                        : ""
                }`;

                const infoButton = document.createElement("div");
                infoButton.className = "flex items-center space-x-3 truncate flex-1 min-w-0";

                const icon = document.createElement("i");
                icon.className = `fa-solid ${getFileIcon(note.name)} text-base shrink-0`;

                const textContainer = document.createElement("div");
                textContainer.className = "truncate";

                const nameText = document.createElement("p");
                nameText.className = "text-sm font-medium text-slate-700 dark:text-slate-200 truncate";
                nameText.textContent = note.name;

                const metaText = document.createElement("p");
                metaText.className = "text-[10px] text-slate-400";
                metaText.textContent = `${new Date(note.updatedAt).toLocaleDateString()} • ${note.content.length} chars`;

                textContainer.appendChild(nameText);
                textContainer.appendChild(metaText);

                infoButton.appendChild(icon);
                infoButton.appendChild(textContainer);

                infoButton.addEventListener("click", () => {
                    loadNote(note.id);
                });

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.className = "p-2 text-slate-400 hover:text-red-500 transition rounded-lg hover:bg-slate-200 dark:hover:bg-slate-600 z-10";
                deleteButton.title = "Delete note";
                deleteButton.setAttribute("aria-label", `Delete ${note.name}`);

                const deleteIcon = document.createElement("i");
                deleteIcon.className = "fa-solid fa-trash-can text-sm";

                deleteButton.appendChild(deleteIcon);

                deleteButton.addEventListener("click", event => {
                    event.stopPropagation();
                    deleteNotePrompt(note.id, note.name);
                });

                item.appendChild(infoButton);
                item.appendChild(deleteButton);
                notesList.appendChild(item);
            });
        }

        /* =========================================================
           OPEN FOLDER (read a folder's contents: index.html, app.js, .css, etc.)
        ========================================================= */

        const supportsDirectoryPicker = "showDirectoryPicker" in window;
        const SKIP_ENTRY_NAMES = new Set(["node_modules", ".git", ".DS_Store"]);

        async function collectDirEntries(dirHandle, basePath, depth = 0) {
            const results = [];

            // Safety limit so a huge/nested folder can't hang the UI.
            if (depth > 6) {
                return results;
            }

            for await (const [name, handle] of dirHandle.entries()) {
                if (SKIP_ENTRY_NAMES.has(name) || name.startsWith(".")) {
                    continue;
                }

                const path = basePath ? `${basePath}/${name}` : name;

                if (handle.kind === "file") {
                    results.push({ path, name, handle, kind: "directoryAPI" });
                } else if (handle.kind === "directory") {
                    const nested = await collectDirEntries(handle, path, depth + 1);
                    results.push(...nested);
                }
            }

            return results;
        }

        function showFolderEntries(name, entries) {
            currentDirName = name;
            openFolderEntries = entries.sort((a, b) => a.path.localeCompare(b.path));
            activeFolderEntry = null;

            folderNameText.textContent = name;
            folderNameText.title = name;
            folderSection.classList.remove("hidden");

            renderFolderFilesList();
        }

        function renderFolderFilesList() {
            folderFilesList.innerHTML = "";

            if (openFolderEntries.length === 0) {
                folderFilesList.innerHTML = `
                    <div class="p-4 text-center text-slate-400 text-xs">
                        No readable files found in this folder.
                    </div>
                `;
                return;
            }

            openFolderEntries.forEach(entry => {
                const item = document.createElement("div");

                item.className = `p-2.5 pl-4 hover:bg-slate-100 dark:hover:bg-slate-700/50 cursor-pointer flex items-center space-x-2.5 transition ${
                    activeFolderEntry && activeFolderEntry.path === entry.path
                        ? "bg-emerald-50/80 dark:bg-emerald-900/20 border-l-4 border-emerald-500"
                        : ""
                }`;

                const icon = document.createElement("i");
                icon.className = `fa-solid ${getFileIcon(entry.name)} text-sm shrink-0`;

                const label = document.createElement("span");
                label.className = "text-xs font-medium text-slate-700 dark:text-slate-200 truncate";
                label.textContent = entry.path;
                label.title = entry.path;

                item.appendChild(icon);
                item.appendChild(label);

                item.addEventListener("click", () => openFolderEntry(entry));

                folderFilesList.appendChild(item);
            });
        }

        function openFolderEntry(entry) {
            if (isDirty && editor.value.trim() !== "") {
                showModal({
                    title: "Open File?",
                    subtitle: "Unsaved modifications",
                    content: `You have unsaved changes. Open "<b>${escapeHtml(entry.name)}</b>" without saving them?`,
                    confirmText: "Open",
                    cancelText: "Cancel",
                    showCancel: true,
                    iconClass: "fa-solid fa-circle-info text-blue-500",
                    confirmBtnClass: "bg-primary hover:bg-blue-600 text-white",
                    onConfirm: () => proceedOpenFolderEntry(entry)
                });
                return;
            }

            proceedOpenFolderEntry(entry);
        }

        async function proceedOpenFolderEntry(entry) {
            try {
                let text = "";

                if (entry.kind === "directoryAPI") {
                    const file = await entry.handle.getFile();
                    text = await file.text();
                    currentFileHandle = entry.handle;
                } else {
                    text = await entry.file.text();
                    currentFileHandle = null;
                }

                clearTimeout(autoSaveTimer);

                currentNoteId = null;
                activeFolderEntry = entry;
                currentFileName = sanitizeFileName(entry.name);

                updateFileNameDisplay();
                editor.value = text;

                fileHandleStatus.textContent = entry.kind === "directoryAPI"
                    ? `${currentDirName}/${entry.path}`
                    : `${currentDirName}/${entry.path} (view only — use Save to export)`;

                setDirtyState(false);
                updateStats();
                renderFolderFilesList();
                renderNotesList();

                if (window.innerWidth < 768) {
                    toggleSidebar(false);
                }
            } catch (error) {
                console.error("Failed to open file from folder:", error);

                showModal({
                    title: "Could Not Open File",
                    subtitle: entry.name,
                    content: "This file could not be read. It may have been moved or deleted, or permission may need to be granted again.",
                    confirmText: "Understood",
                    showCancel: false,
                    iconClass: "fa-solid fa-triangle-exclamation text-red-500",
                    confirmBtnClass: "bg-red-600 hover:bg-red-700 text-white"
                });
            }
        }

        async function openFolder() {
            if (supportsDirectoryPicker) {
                try {
                    let dirHandle;

                    try {
                        // Ask for read/write up front so files can be saved back in place.
                        dirHandle = await window.showDirectoryPicker({ mode: "readwrite" });
                    } catch (permissionError) {
                        // Some browsers reject the "mode" option outright — fall back to read-only.
                        dirHandle = await window.showDirectoryPicker();
                    }

                    const entries = await collectDirEntries(dirHandle, "");
                    showFolderEntries(dirHandle.name, entries);
                } catch (error) {
                    if (error.name !== "AbortError") {
                        console.warn("Folder open failed:", error);

                        showModal({
                            title: "Could Not Open Folder",
                            subtitle: "Folder access failed",
                            content: "This folder could not be opened. Permission may have been denied, or your browser may not fully support folder access.",
                            confirmText: "Understood",
                            showCancel: false,
                            iconClass: "fa-solid fa-triangle-exclamation text-red-500",
                            confirmBtnClass: "bg-red-600 hover:bg-red-700 text-white"
                        });
                    }
                }

                return;
            }

            // Fallback for browsers without the File System Access API
            // (common on many mobile browsers): use a hidden directory input.
            folderInputFallback.click();
        }

        openFolderBtn.addEventListener("click", openFolder);

        folderInputFallback.addEventListener("change", event => {
            const files = Array.from(event.target.files || []);
            folderInputFallback.value = "";

            if (files.length === 0) {
                return;
            }

            const firstPath = files[0].webkitRelativePath || files[0].name;
            const rootName = firstPath.split("/")[0] || "Folder";

            const entries = files
                .filter(file => !file.name.startsWith("."))
                .map(file => {
                    const relativePath = file.webkitRelativePath || file.name;
                    const path = relativePath.includes("/")
                        ? relativePath.substring(relativePath.indexOf("/") + 1)
                        : relativePath;

                    return { path: path || relativePath, name: file.name, file, kind: "inputFallback" };
                })
                .filter(entry => !entry.path.split("/").some(part => SKIP_ENTRY_NAMES.has(part)));

            showFolderEntries(rootName, entries);
        });

        closeFolderBtn.addEventListener("click", () => {
            currentDirName = "";
            openFolderEntries = [];
            activeFolderEntry = null;

            folderSection.classList.add("hidden");
            folderFilesList.innerHTML = "";
        });

        /* =========================================================
           STATS & DIRTY STATE
        ========================================================= */

        function updateStats() {
            const text = editor.value;

            const chars = text.length;
            const words = text.trim() === "" ? 0 : text.trim().split(/\s+/).length;

            wordCountDisplay.textContent = `Words: ${words}`;
            charCountDisplay.textContent = `Chars: ${chars}`;
        }

        function setDirtyState(dirty) {
            isDirty = dirty;

            if (dirty) {
                unsavedIndicator.classList.remove("hidden");
            } else {
                unsavedIndicator.classList.add("hidden");
            }
        }

        /* =========================================================
           AUTO-SAVE
        ========================================================= */

        function scheduleAutoSave() {
            clearTimeout(autoSaveTimer);

            autoSaveTimer = setTimeout(() => {
                autoSaveCache();
            }, 500);
        }

        function autoSaveCache() {
            // Do not auto-save while the app is initializing.
            if (isInitializing) {
                return;
            }

            // Files opened from a folder already live on disk; don't duplicate
            // them into the browser's local "Saved Notes" cache.
            if (activeFolderEntry) {
                return;
            }

            // Do not create a saved note for a completely empty editor.
            // This prevents deletion from immediately recreating a note.
            if (!currentNoteId && editor.value.trim() === "") {
                return;
            }

            if (!currentNoteId) {
                currentNoteId = "note_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
            }

            const notes = getSavedNotes();
            const existingIndex = notes.findIndex(note => note.id === currentNoteId);

            const noteObject = {
                id: currentNoteId,
                name: currentFileName,
                content: editor.value,
                updatedAt: Date.now()
            };

            if (existingIndex >= 0) {
                notes[existingIndex] = noteObject;
            } else {
                notes.unshift(noteObject);
            }

            if (writeNotes(notes)) {
                renderNotesList();
            }
        }

        editor.addEventListener("input", () => {
            updateStats();

            if (!isInitializing) {
                setDirtyState(true);
                scheduleAutoSave();
            }
        });

        // Hide the on-screen keyboard right after a paste so pasted code
        // (often large) doesn't leave the keyboard covering half the screen.
        // Tapping the editor again focuses it and brings the keyboard back.
        editor.addEventListener("paste", () => {
            setTimeout(() => {
                editor.blur();
            }, 0);
        });

        /* =========================================================
           INSERT TEXT
        ========================================================= */

        function getInsertText(type) {
            if (type === "boilerplate") {
                return `<!DOCTYPE html>
<html>
<head>
    <title>Page</title>
</head>
<body>
    
</body>
</html>`;
            }

            if (type === "div") {
                return `<div class="">
    
</div>`;
            }

            if (type === "script") {
                return `<script>
    
<\/script>`;
            }

            if (type === "style") {
                return `<style>
    
<\/style>`;
            }

            if (type === "class") {
                return `class=""`;
            }

            return type;
        }

        function insertText(textToInsert) {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const value = editor.value;

            editor.value =
                value.substring(0, start) +
                textToInsert +
                value.substring(end);

            editor.selectionStart = editor.selectionEnd = start + textToInsert.length;

            editor.focus();

            updateStats();
            setDirtyState(true);
            scheduleAutoSave();
        }

        document.querySelectorAll(".quick-insert").forEach(button => {
            button.addEventListener("click", () => {
                insertText(getInsertText(button.dataset.insert));
            });
        });

        /* =========================================================
           LOAD NOTE
        ========================================================= */

        function loadNote(id) {
            const notes = getSavedNotes();
            const note = notes.find(item => item.id === id);

            if (!note) {
                return;
            }

            if (isDirty && editor.value.trim() !== "") {
                showModal({
                    title: "Switch Note?",
                    subtitle: "Unsaved modifications",
                    content: "You have unsaved changes in your current note. Do you want to switch without saving?",
                    confirmText: "Switch",
                    confirmBtnClass: "bg-primary hover:bg-blue-600 text-white",
                    onConfirm: () => proceedLoad(note)
                });
                return;
            }

            proceedLoad(note);
        }

        function proceedLoad(note) {
            currentNoteId = note.id;
            currentFileName = sanitizeFileName(note.name || "index.html");

            updateFileNameDisplay();

            editor.value = note.content || "";
            currentFileHandle = null;
            activeFolderEntry = null;

            fileHandleStatus.textContent = "Local Storage Cache";

            setDirtyState(false);
            updateStats();
            renderNotesList();
            renderFolderFilesList();

            if (window.innerWidth < 768) {
                toggleSidebar(false);
            }
        }

        /* =========================================================
           DELETE NOTE
        ========================================================= */

        function deleteNotePrompt(id, name) {
            showModal({
                title: "Delete Note",
                subtitle: name,
                content: `Are you sure you want to permanently delete "<b>${escapeHtml(name)}</b>" from your stored notes?`,
                confirmText: "Delete",
                cancelText: "Cancel",
                showCancel: true,
                iconClass: "fa-solid fa-triangle-exclamation text-red-500",
                confirmBtnClass: "bg-red-600 hover:bg-red-700 text-white",
                onConfirm: () => deleteNote(id)
            });
        }

        function deleteNote(id) {
            const notes = getSavedNotes();
            const noteToDelete = notes.find(note => note.id === id);

            if (!noteToDelete) {
                renderNotesList();
                return;
            }

            const remainingNotes = notes.filter(note => note.id !== id);

            if (!writeNotes(remainingNotes)) {
                return;
            }

            // If deleting an inactive note, leave the editor untouched.
            if (currentNoteId !== id) {
                renderNotesList();
                return;
            }

            // If deleting the active note, cancel any pending autosave.
            clearTimeout(autoSaveTimer);

            // Load another existing note if available.
            if (remainingNotes.length > 0) {
                const nextNote = remainingNotes[0];

                currentNoteId = nextNote.id;
                currentFileName = sanitizeFileName(nextNote.name || "index.html");
                currentFileHandle = null;
                activeFolderEntry = null;

                editor.value = nextNote.content || "";

                updateFileNameDisplay();
                fileHandleStatus.textContent = "Local Storage Cache";
                setDirtyState(false);
                updateStats();
            } else {
                // IMPORTANT:
                // Do not call newFile() here.
                // That would create and auto-save a replacement note.
                currentNoteId = null;
                currentFileHandle = null;
                activeFolderEntry = null;
                currentFileName = "index.html";

                editor.value = "";

                updateFileNameDisplay();
                fileHandleStatus.textContent = "No Saved Notes";
                setDirtyState(false);
                updateStats();
            }

            renderNotesList();
            renderFolderFilesList();
        }

        /* =========================================================
           NEW NOTE
        ========================================================= */

        function newFile() {
            if (isDirty && editor.value.trim() !== "") {
                showModal({
                    title: "Create New Note?",
                    subtitle: "Unsaved modifications",
                    content: "Your current file has unsaved changes. Create a new note anyway?",
                    confirmText: "New Note",
                    cancelText: "Cancel",
                    showCancel: true,
                    iconClass: "fa-solid fa-circle-info text-blue-500",
                    confirmBtnClass: "bg-primary hover:bg-blue-600 text-white",
                    onConfirm: proceedNewFile
                });
                return;
            }

            proceedNewFile();
        }

        function proceedNewFile() {
            clearTimeout(autoSaveTimer);

            const enteredName = prompt(
                "Filename for the new note (e.g. index.html, script.js, notes.txt):",
                "index.html"
            );

            if (!enteredName || enteredName.trim() === "") {
                return;
            }

            currentNoteId = null;
            currentFileHandle = null;
            activeFolderEntry = null;

            currentFileName = sanitizeFileName(enteredName);

            updateFileNameDisplay();

            fileHandleStatus.textContent = "New Local File";

            // The starting template is decided purely by the extension
            // actually typed in the filename — nothing else governs this.
            const lowerName = currentFileName.toLowerCase();
            editor.value = (lowerName.endsWith(".html") || lowerName.endsWith(".htm"))
                ? DEFAULT_HTML
                : "";

            setDirtyState(false);
            updateStats();

            // Do not save immediately.
            // The note will be saved once the user types or inserts content.
            renderNotesList();
            renderFolderFilesList();

            if (window.innerWidth < 768) {
                toggleSidebar(false);
            }

            editor.focus();
        }

        newBtn.addEventListener("click", event => {
            event.preventDefault();
            newFile();
        });

        /* =========================================================
           RENAME
        ========================================================= */

        function promptRenameFile() {
            const enteredName = prompt(
                "Enter new filename (e.g. index.html, script.js, notes.txt):",
                currentFileName
            );

            if (!enteredName || enteredName.trim() === "") {
                return;
            }

            const newName = sanitizeFileName(enteredName);

            if (!newName) {
                return;
            }

            currentFileName = newName;
            updateFileNameDisplay();

            // If the current note already exists, update its name.
            if (currentNoteId) {
                const notes = getSavedNotes();
                const index = notes.findIndex(note => note.id === currentNoteId);

                if (index >= 0) {
                    notes[index].name = currentFileName;
                    notes[index].updatedAt = Date.now();
                    writeNotes(notes);
                }
            }

            renderNotesList();
        }

        fileNameDisplay.addEventListener("click", promptRenameFile);

        /* =========================================================
           FILE TYPE
           (extension is always read directly from the filename —
           no separate type selector exists anymore.)
        ========================================================= */

        /* =========================================================
           SAVE FILE TO DEVICE
        ========================================================= */

        function getMimeType(fileName) {
            const name = fileName.toLowerCase();

            if (name.endsWith(".html") || name.endsWith(".htm")) {
                return "text/html";
            }

            if (name.endsWith(".css")) {
                return "text/css";
            }

            if (name.endsWith(".js")) {
                return "text/javascript";
            }

            if (name.endsWith(".json")) {
                return "application/json";
            }

            if (name.endsWith(".md")) {
                return "text/markdown";
            }

            return "text/plain";
        }

        async function trySaveToHandle(handle) {
            try {
                if (typeof handle.queryPermission === "function") {
                    let permission = await handle.queryPermission({ mode: "readwrite" });

                    if (permission !== "granted" && typeof handle.requestPermission === "function") {
                        permission = await handle.requestPermission({ mode: "readwrite" });
                    }

                    if (permission !== "granted") {
                        return false;
                    }
                }

                const writable = await handle.createWritable();
                await writable.write(editor.value);
                await writable.close();

                return true;
            } catch (error) {
                console.warn("Direct save to file handle failed:", error);
                return false;
            }
        }

        async function saveAsFile(event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            clearTimeout(autoSaveTimer);

            // Files opened from a folder (or previously saved via the picker)
            // already have a writable handle — save straight back to them.
            if (currentFileHandle && typeof currentFileHandle.createWritable === "function") {
                const saved = await trySaveToHandle(currentFileHandle);

                if (saved) {
                    currentFileName = sanitizeFileName(currentFileHandle.name);
                    updateFileNameDisplay();

                    fileHandleStatus.textContent = activeFolderEntry
                        ? `${currentDirName}/${activeFolderEntry.path}`
                        : "Saved to Device";

                    setDirtyState(false);
                    renderNotesList();
                    renderFolderFilesList();
                    return;
                }
                // If the direct write failed (e.g. permission revoked), fall through
                // to the picker/download flow below.
            }

            // Ensure the latest content is cached before exporting.
            autoSaveCache();

            if (window.showSaveFilePicker) {
                // Step 1: the actual file write. ONLY this part decides whether
                // we fall back to the download method — a failure here means
                // the file picker/write itself didn't work.
                let handle = null;

                try {
                    // Only offer ONE type — the one matching the current file's
                    // extension. Some Android browsers collapse a list of accepted
                    // formats down into a single system-level MIME type for their
                    // underlying save dialog, and can pick the wrong one out of
                    // several options (stamping on an unrelated extension, e.g.
                    // "index.html.json"). Giving it just one option removes any
                    // ambiguity for that resolution step.
                    const knownTypes = [
                        { description: "HTML File", accept: { "text/html": [".html", ".htm"] } },
                        { description: "Text File", accept: { "text/plain": [".txt", ".md"] } },
                        { description: "JavaScript File", accept: { "text/javascript": [".js"] } },
                        { description: "CSS File", accept: { "text/css": [".css"] } },
                        { description: "JSON File", accept: { "application/json": [".json"] } }
                    ];

                    const lowerName = currentFileName.toLowerCase();
                    const matched = knownTypes.find(t =>
                        Object.values(t.accept)[0].some(ext => lowerName.endsWith(ext))
                    );

                    const opts = {
                        suggestedName: currentFileName,
                        types: matched ? [matched] : []
                    };

                    handle = await window.showSaveFilePicker(opts);
                    const writable = await handle.createWritable();

                    await writable.write(editor.value);
                    await writable.close();

                    // Some browsers/apps implement a broken or partial version of
                    // this API: the folder dialog appears and "succeeds", but the
                    // write never actually lands (resulting in a 0-byte file, or
                    // one saved with the wrong extension). Read the file back to
                    // confirm the content is really there before trusting this path.
                    const expectedLength = editor.value.length;

                    if (expectedLength > 0) {
                        const savedFile = await handle.getFile();

                        if (savedFile.size === 0) {
                            throw new Error(
                                "Write verification failed: file is empty after save " +
                                "(this browser's folder-save support appears broken)."
                            );
                        }
                    }

                } catch (error) {
                    if (error.name === "AbortError") {
                        return;
                    }

                    console.warn("File picker unavailable or failed:", error);
                    handle = null;
                    // Fall through to the download fallback below — the write
                    // genuinely didn't happen (or couldn't be verified).
                }

                // Step 2: the file was actually written successfully. Everything
                // from here on is just UI/bookkeeping — if any of it throws, we
                // log it but we must NOT fall through to the download fallback,
                // since that would silently create a duplicate save.
                if (handle) {
                    try {
                        currentFileHandle = handle;
                        currentFileName = sanitizeFileName(handle.name);
                        activeFolderEntry = null;

                        updateFileNameDisplay();

                        fileHandleStatus.textContent = "Saved to Device";
                        setDirtyState(false);

                        // Update cached note name after save.
                        if (currentNoteId) {
                            const notes = getSavedNotes();
                            const index = notes.findIndex(note => note.id === currentNoteId);

                            if (index >= 0) {
                                notes[index].name = currentFileName;
                                notes[index].content = editor.value;
                                notes[index].updatedAt = Date.now();
                                writeNotes(notes);
                            }
                        }

                        renderNotesList();
                    } catch (postSaveError) {
                        // The file is already safely saved to disk at this point.
                        // A UI/bookkeeping glitch here should never trigger a
                        // second, duplicate download.
                        console.error("Post-save UI update failed (file was still saved):", postSaveError);
                    }

                    return;
                }
            }

            // Browser download fallback.
            const blob = new Blob([editor.value], {
                type: `${getMimeType(currentFileName)};charset=utf-8`
            });

            const url = URL.createObjectURL(blob);
            const anchor = document.createElement("a");

            anchor.href = url;
            anchor.download = currentFileName;

            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);

            URL.revokeObjectURL(url);

            activeFolderEntry = null;
            fileHandleStatus.textContent = "Saved to Downloads";
            setDirtyState(false);

            renderNotesList();
            renderFolderFilesList();
        }

        saveAsBtn.addEventListener("click", saveAsFile);

        window.addEventListener("keydown", event => {
            if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
                event.preventDefault();
                saveAsFile();
            }
        });

        /* =========================================================
           SAVE LOCATION HELP
        ========================================================= */

        function showSaveLocationHelp() {
            showModal({
                title: "Where are files saved?",
                subtitle: "Accessing your saved files",
                content: `Depending on how your browser handles saving:<br><br>
                    1. <b>File Picker:</b> If your browser opens a file picker and you choose a folder, the file is saved in that selected location.<br><br>
                    2. <b>Downloads:</b> If the browser downloads the file directly, it is usually placed in your device's default <b>Downloads</b> folder.<br><br>
                    3. <b>Saved Notes:</b> Notes shown in the sidebar are stored in your browser's local storage. They are not automatically the same as files saved to your device.`,
                confirmText: "Understood",
                showCancel: false,
                iconClass: "fa-solid fa-folder-open text-blue-500",
                confirmBtnClass: "bg-primary hover:bg-blue-600 text-white"
            });
        }

        saveLocationHelpBtn.addEventListener("click", showSaveLocationHelp);

        /* =========================================================
           HARD REFRESH
        ========================================================= */

        function hardRefreshApp() {
            showModal({
                title: "Reload App",
                subtitle: "Refresh the application",
                content: "The app will reload. Your saved notes in browser storage will remain intact. This does not clear your browser's entire cache.",
                confirmText: "Reload Now",
                cancelText: "Cancel",
                showCancel: true,
                iconClass: "fa-solid fa-rotate text-primary",
                confirmBtnClass: "bg-primary hover:bg-blue-600 text-white",
                onConfirm: () => {
                    window.location.reload();
                }
            });
        }

        hardRefreshBtn.addEventListener("click", hardRefreshApp);

        /* =========================================================
           HTML ESCAPE
        ========================================================= */

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        /* =========================================================
           INITIALIZATION
        ========================================================= */

        window.addEventListener("DOMContentLoaded", () => {
            const notes = getSavedNotes();

            if (notes.length > 0) {
                proceedLoad(notes[0]);
            } else {
                // Start with a new editor, but do not save it automatically.
                currentNoteId = null;
                currentFileName = "index.html";
                currentFileHandle = null;

                updateFileNameDisplay();

                fileHandleStatus.textContent = "New Local File";
                editor.value = DEFAULT_HTML;

                setDirtyState(false);
                updateStats();
            }

            renderNotesList();

            // Initialization is complete.
            isInitializing = false;
        });

        window.addEventListener("beforeunload", () => {
            previewObjectUrls.forEach(url => URL.revokeObjectURL(url));
        });
    </script>
</body>
</html>
